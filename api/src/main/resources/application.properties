# Port: Cloud Run sets PORT; locally we use 8080.
server.port=${PORT:8080}
# Folder with the on-disk index, built by scripts/sift-index.
sift.index-dir=${SIFT_INDEX_DIR:data/index}
spring.application.name=sift-api
# Our own JSON for unknown paths instead of Spring's default error page.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
server.error.whitelabel.enabled=false
# Smart search (Phase 5). Model files from data-prep/export_model.py, vectors from data-prep/embed_articles.py,
# graph + int8 vectors from scripts/sift-run vector.HnswBuildCli. Chosen by the pre-registered Phase 5 fix
# experiment (eval/results/fix-variants.txt): bge-small-en-v1.5, title + 60 words, query prefix, plain RRF
# (hybrid MRR 0.956 vs 0.868 for the first MiniLM version). efSearch 400 = smallest with recall@10 >= 0.95
# (0.957); int8 recall vs float32 0.986, same MRR (eval/results/vector-recall-bge60.txt, smart-main-bge60.txt).
sift.model-dir=${SIFT_MODEL_DIR:data/model-bge}
# one folder, or two separated by a comma (two vectors per article, similarity = max)
sift.vectors-dirs=${SIFT_VECTORS_DIRS:data/vectors-bge60}
sift.graph-file=${SIFT_GRAPH_FILE:data/vectors-bge60/hnsw.bin}
sift.vector-kind=${SIFT_VECTOR_KIND:int8}
sift.smart-mode=${SIFT_SMART_MODE:hybrid}
sift.ef-search=${SIFT_EF_SEARCH:400}
# RRF weight of the keyword list (1 = plain RRF)
sift.keyword-weight=${SIFT_KEYWORD_WEIGHT:1}
# Cache of finished search pages (Phase 6): max entries, 0 = off. A page is ~5-10 KB, so 10,000 is at most ~100 MB.
sift.cache-size=${SIFT_CACHE_SIZE:10000}
