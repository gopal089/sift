# Port: Cloud Run sets PORT; locally we use 8080.
server.port=${PORT:8080}
# Folder with the on-disk index, built by scripts/sift-index.
sift.index-dir=${SIFT_INDEX_DIR:data/index}
spring.application.name=sift-api
# Our own JSON for unknown paths instead of Spring's default error page.
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
server.error.whitelabel.enabled=false
# Smart search (Phase 5). Model files from data-prep/export_model.py, vectors from data-prep/embed_articles.py,
# graph + int8 vectors from scripts/sift-run vector.HnswBuildCli. Settings chosen by the Phase 5 rules:
# efSearch 200 (smallest with recall@10 >= 0.95), int8 (recall 0.995, hybrid MRR +0.010), hybrid (0.868 vs 0.649).
sift.model-dir=${SIFT_MODEL_DIR:data/model}
sift.vectors-dir=${SIFT_VECTORS_DIR:data/vectors}
sift.vector-kind=${SIFT_VECTOR_KIND:int8}
sift.smart-mode=${SIFT_SMART_MODE:hybrid}
sift.ef-search=${SIFT_EF_SEARCH:200}
